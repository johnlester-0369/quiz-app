<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="quiz-wrapper" id="app">

  <!-- CATEGORY SELECTION SCREEN -->
  <div id="category-screen">
    <div class="category-header">
      <div class="category-title">Quiz Hub</div>
      <div class="category-subtitle">Choose a topic to get started</div>
    </div>
    <div class="category-grid" id="category-grid">
      <!-- Cards rendered by js/quiz.js so quiz group data is the single source of truth -->
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="quiz-header">
      <div class="quiz-header-inner">
        <button class="back-btn" id="quiz-back-btn" aria-label="Back to categories">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="quiz-title" id="quiz-title">Quiz</div>
      </div>
      <div class="quiz-subtitle" id="quiz-subtitle"></div>
    </div>

    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div class="question-card" id="question-card">
      <div class="question-meta">
        <span class="question-badge" id="q-badge">Question 1</span>
        <span class="question-counter" id="q-counter">1 / 1</span>
      </div>
      <p class="question-text" id="q-text"></p>
      <ul class="choices-list" id="choices-list"></ul>
      <div class="feedback-bar" id="feedback-bar"></div>
      <button class="next-btn" id="next-btn"></button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="hidden">
    <div class="results-card">
      <div class="results-score-ring" id="results-score-ring">
        <div>
          <div class="results-score-number" id="res-score">0</div>
          <div class="results-score-total" id="res-total">/ 0</div>
        </div>
      </div>
      <div class="results-title" id="res-title">Well done!</div>
      <div class="results-message" id="res-message"></div>
      <div class="results-stat-row">
        <div class="results-stat stat-correct">
          <div class="results-stat-value" id="res-correct">0</div>
          <div class="results-stat-label">Correct</div>
        </div>
        <div class="results-stat stat-wrong">
          <div class="results-stat-value" id="res-wrong">0</div>
          <div class="results-stat-label">Incorrect</div>
        </div>
      </div>
      <div class="results-btn-group">
        <button class="restart-btn" id="restart-btn">Try Again</button>
        <button class="back-to-categories-btn" id="back-to-cat-btn">← All Categories</button>
      </div>
    </div>
  </div>

</div>

<!-- type="module" implicitly defers execution until DOM is parsed, and enables ES import/export.
     Requires a local HTTP server (e.g. npx serve .) — ES module imports are blocked on file:// by CORS. -->
<script type="module" src="js/app.js"></script>
</body>
</html>
