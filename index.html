<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    /* ==================== DESIGN TOKENS ==================== */
    :root {
      --light-color-primary: 68 114 210;
      --light-color-on-primary: 255 255 255;
      --light-color-primary-container: 221 232 254;
      --light-color-on-primary-container: 26 48 95;
      --light-color-secondary: 126 93 209;
      --light-color-on-secondary: 255 255 255;
      --light-color-secondary-container: 232 228 254;
      --light-color-on-secondary-container: 54 38 94;
      --light-color-tertiary: 168 72 181;
      --light-color-on-tertiary: 255 255 255;
      --light-color-tertiary-container: 247 222 250;
      --light-color-on-tertiary-container: 75 28 81;
      --light-color-surface: 255 255 255;
      --light-color-on-surface: 0 0 0;
      --light-color-surface-variant: 202 213 226;
      --light-color-on-surface-variant: 50 65 87;
      --light-color-surface-container-lowest: 255 255 255;
      --light-color-surface-container-low: 248 250 252;
      --light-color-surface-container: 241 245 249;
      --light-color-surface-container-high: 227 233 241;
      --light-color-surface-container-highest: 212 221 232;
      --light-color-surface-bright: 255 255 255;
      --light-color-surface-dim: 144 161 185;
      --light-color-inverse-surface: 29 41 58;
      --light-color-inverse-on-surface: 248 250 252;
      --light-color-inverse-primary: 196 216 253;
      --light-color-outline: 98 116 142;
      --light-color-outline-variant: 144 161 185;
      --light-color-scrim: 0 0 0;
      --light-color-shadow: 0 0 0;
      --light-color-error: 231 0 11;
      --light-color-on-error: 254 242 242;
      --light-color-error-container: 255 226 226;
      --light-color-on-error-container: 130 24 26;
      --light-color-success: 0 130 54;
      --light-color-on-success: 240 253 244;
      --light-color-success-container: 220 252 231;
      --light-color-on-success-container: 13 84 43;
      --light-color-warning: 225 113 0;
      --light-color-on-warning: 255 251 235;
      --light-color-warning-container: 254 243 198;
      --light-color-on-warning-container: 123 51 6;
      --light-color-info: 0 132 209;
      --light-color-on-info: 240 249 255;
      --light-color-info-container: 223 242 254;
      --light-color-on-info-container: 2 74 112;
      --light-color-gradient-primary: linear-gradient(135deg, rgb(53,109,232) 0%, rgb(23,129,175) 100%);
      --light-color-gradient-secondary: linear-gradient(135deg, rgb(128,87,221) 0%, rgb(55,109,232) 100%);
      --light-color-gradient-tertiary: linear-gradient(135deg, rgb(170,68,184) 0%, rgb(127,88,222) 100%);
      --light-color-gradient-error: linear-gradient(135deg, rgb(210,53,43) 0%, rgb(174,97,20) 100%);
      --light-color-gradient-success: linear-gradient(135deg, rgb(24,143,58) 0%, rgb(25,138,119) 100%);
      --light-color-gradient-warning: linear-gradient(135deg, rgb(179,92,19) 0%, rgb(150,113,20) 100%);
      --light-color-gradient-info: linear-gradient(135deg, rgb(23,125,194) 0%, rgb(24,133,154) 100%);

      --color-primary: var(--light-color-primary);
      --color-on-primary: var(--light-color-on-primary);
      --color-primary-container: var(--light-color-primary-container);
      --color-on-primary-container: var(--light-color-on-primary-container);
      --color-secondary: var(--light-color-secondary);
      --color-on-secondary: var(--light-color-on-secondary);
      --color-secondary-container: var(--light-color-secondary-container);
      --color-on-secondary-container: var(--light-color-on-secondary-container);
      --color-tertiary: var(--light-color-tertiary);
      --color-on-tertiary: var(--light-color-on-tertiary);
      --color-tertiary-container: var(--light-color-tertiary-container);
      --color-on-tertiary-container: var(--light-color-on-tertiary-container);
      --color-surface: var(--light-color-surface);
      --color-on-surface: var(--light-color-on-surface);
      --color-surface-variant: var(--light-color-surface-variant);
      --color-on-surface-variant: var(--light-color-on-surface-variant);
      --color-surface-container-lowest: var(--light-color-surface-container-lowest);
      --color-surface-container-low: var(--light-color-surface-container-low);
      --color-surface-container: var(--light-color-surface-container);
      --color-surface-container-high: var(--light-color-surface-container-high);
      --color-surface-container-highest: var(--light-color-surface-container-highest);
      --color-surface-bright: var(--light-color-surface-bright);
      --color-surface-dim: var(--light-color-surface-dim);
      --color-inverse-surface: var(--light-color-inverse-surface);
      --color-inverse-on-surface: var(--light-color-inverse-on-surface);
      --color-inverse-primary: var(--light-color-inverse-primary);
      --color-outline: var(--light-color-outline);
      --color-outline-variant: var(--light-color-outline-variant);
      --color-scrim: var(--light-color-scrim);
      --color-shadow: var(--light-color-shadow);
      --color-error: var(--light-color-error);
      --color-on-error: var(--light-color-on-error);
      --color-error-container: var(--light-color-error-container);
      --color-on-error-container: var(--light-color-on-error-container);
      --color-success: var(--light-color-success);
      --color-on-success: var(--light-color-on-success);
      --color-success-container: var(--light-color-success-container);
      --color-on-success-container: var(--light-color-on-success-container);
      --color-warning: var(--light-color-warning);
      --color-on-warning: var(--light-color-on-warning);
      --color-warning-container: var(--light-color-warning-container);
      --color-on-warning-container: var(--light-color-on-warning-container);
      --color-info: var(--light-color-info);
      --color-on-info: var(--light-color-on-info);
      --color-info-container: var(--light-color-info-container);
      --color-on-info-container: var(--light-color-on-info-container);
      --color-gradient-primary: var(--light-color-gradient-primary);
      --color-gradient-secondary: var(--light-color-gradient-secondary);
      --color-gradient-tertiary: var(--light-color-gradient-tertiary);
      --color-gradient-error: var(--light-color-gradient-error);
      --color-gradient-success: var(--light-color-gradient-success);
      --color-gradient-warning: var(--light-color-gradient-warning);
      --color-gradient-info: var(--light-color-gradient-info);
    }

    /* ==================== RESET & BASE ==================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: rgb(var(--color-surface-container-low));
      color: rgb(var(--color-on-surface));
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ==================== LAYOUT ==================== */
    .quiz-wrapper {
      width: 100%;
      max-width: 600px;
    }

    /* ==================== CATEGORY SCREEN ==================== */
    .category-header {
      margin-bottom: 28px;
      animation: fadeSlideDown 0.4s ease both;
    }

    .category-title {
      font-size: 26px;
      font-weight: 600;
      color: rgb(var(--color-on-surface));
      letter-spacing: -0.4px;
    }

    .category-subtitle {
      font-size: 14px;
      font-weight: 400;
      color: rgb(var(--color-on-surface-variant));
      margin-top: 4px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    /* Each category card staggered in to create a cascade reveal */
    .category-card {
      background-color: rgb(var(--color-surface));
      border-radius: 18px;
      padding: 22px 20px;
      cursor: pointer;
      border: 1.5px solid rgb(var(--color-surface-container-high));
      box-shadow:
        0 1px 3px rgba(var(--color-shadow), 0.06),
        0 4px 12px rgba(var(--color-shadow), 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      text-align: left;
      font-family: 'DM Sans', sans-serif;
      opacity: 0;
      animation: fadeSlideUp 0.4s ease forwards;
    }

    .category-card:nth-child(1) { animation-delay: 0.05s; }
    .category-card:nth-child(2) { animation-delay: 0.12s; }
    .category-card:nth-child(3) { animation-delay: 0.19s; }
    .category-card:nth-child(4) { animation-delay: 0.26s; }

    .category-card:hover {
      transform: translateY(-3px);
      box-shadow:
        0 4px 12px rgba(var(--color-shadow), 0.10),
        0 8px 28px rgba(var(--color-shadow), 0.08);
      border-color: rgb(var(--color-outline-variant));
    }

    .category-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .category-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 14px;
      /* background set inline per card via data-gradient */
    }

    .category-card-title {
      font-size: 15px;
      font-weight: 600;
      color: rgb(var(--color-on-surface));
      letter-spacing: -0.1px;
      margin-bottom: 4px;
    }

    .category-card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-count {
      font-size: 12px;
      font-weight: 400;
      color: rgb(var(--color-on-surface-variant));
    }

    .category-difficulty {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .difficulty-beginner {
      background-color: rgb(var(--color-success-container));
      color: rgb(var(--color-on-success-container));
    }

    .difficulty-intermediate {
      background-color: rgb(var(--color-warning-container));
      color: rgb(var(--color-on-warning-container));
    }

    /* ==================== HEADER ==================== */
    .quiz-header {
      margin-bottom: 24px;
      animation: fadeSlideDown 0.4s ease both;
    }

    .quiz-header-inner {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-btn {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background-color: rgb(var(--color-surface-container));
      border: 1.5px solid rgb(var(--color-surface-container-high));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(var(--color-on-surface-variant));
      transition: background-color 0.15s ease;
      font-family: 'DM Sans', sans-serif;
    }

    .back-btn:hover {
      background-color: rgb(var(--color-surface-container-high));
    }

    .quiz-title {
      font-size: 20px;
      font-weight: 600;
      color: rgb(var(--color-on-surface));
      letter-spacing: -0.3px;
    }

    .quiz-subtitle {
      font-size: 13px;
      font-weight: 400;
      color: rgb(var(--color-on-surface-variant));
      margin-top: 2px;
      margin-left: 44px; /* aligns under title, past the back button */
    }

    /* ==================== PROGRESS ==================== */
    .progress-bar-track {
      height: 6px;
      background-color: rgb(var(--color-surface-container-high));
      border-radius: 99px;
      margin-bottom: 24px;
      overflow: hidden;
      animation: fadeSlideDown 0.4s 0.05s ease both;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      /* gradient injected via JS to match the active quiz group's color */
    }

    /* ==================== QUESTION CARD ==================== */
    .question-card {
      background-color: rgb(var(--color-surface));
      border-radius: 20px;
      padding: 28px;
      box-shadow:
        0 1px 3px rgba(var(--color-shadow), 0.08),
        0 4px 16px rgba(var(--color-shadow), 0.06);
      animation: fadeSlideDown 0.4s 0.1s ease both;
    }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .question-badge {
      font-size: 12px;
      font-weight: 500;
      color: rgb(var(--color-on-primary-container));
      background-color: rgb(var(--color-primary-container));
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 0.2px;
    }

    .question-counter {
      font-size: 13px;
      font-weight: 400;
      color: rgb(var(--color-on-surface-variant));
    }

    .question-text {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.55;
      color: rgb(var(--color-on-surface));
      margin-bottom: 24px;
      letter-spacing: -0.1px;
    }

    /* ==================== CHOICES ==================== */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      list-style: none;
    }

    .choice-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 16px;
      background-color: rgb(var(--color-surface-container-low));
      border: 1.5px solid rgb(var(--color-outline-variant));
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgb(var(--color-on-surface));
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .choice-btn:hover:not(:disabled) {
      background-color: rgb(var(--color-surface-container));
      border-color: rgb(var(--color-outline));
    }

    .choice-btn:active:not(:disabled) { transform: scale(0.99); }
    .choice-btn:disabled { cursor: default; }

    .choice-label {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background-color: rgb(var(--color-surface-container-highest));
      color: rgb(var(--color-on-surface-variant));
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .choice-text { flex: 1; line-height: 1.45; }

    .choice-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .choice-btn.correct {
      background-color: rgb(var(--color-success-container));
      border-color: rgb(var(--color-success));
    }

    .choice-btn.correct .choice-label {
      background-color: rgb(var(--color-success));
      color: rgb(var(--color-on-success));
    }

    .choice-btn.correct .choice-icon { opacity: 1; }

    .choice-btn.wrong {
      background-color: rgb(var(--color-error-container));
      border-color: rgb(var(--color-error));
    }

    .choice-btn.wrong .choice-label {
      background-color: rgb(var(--color-error));
      color: rgb(var(--color-on-error));
    }

    .choice-btn.wrong .choice-icon { opacity: 1; }

    .choice-btn.reveal-correct {
      background-color: rgb(var(--color-success-container));
      border-color: rgb(var(--color-success));
      opacity: 0.7;
    }

    .choice-btn.reveal-correct .choice-label {
      background-color: rgb(var(--color-success));
      color: rgb(var(--color-on-success));
    }

    .choice-btn.muted { opacity: 0.45; }

    /* ==================== FEEDBACK BAR ==================== */
    .feedback-bar {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .feedback-bar.visible { opacity: 1; transform: translateY(0); }

    .feedback-bar.correct-feedback {
      background-color: rgb(var(--color-success-container));
      color: rgb(var(--color-on-success-container));
    }

    .feedback-bar.wrong-feedback {
      background-color: rgb(var(--color-error-container));
      color: rgb(var(--color-on-error-container));
    }

    /* ==================== NEXT BUTTON ==================== */
    .next-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px 20px;
      color: rgb(var(--color-on-primary));
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.1px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      /* background set via JS to match active quiz group's gradient */
    }

    .next-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .next-btn:hover { opacity: 0.92; }
    .next-btn:active { transform: scale(0.99); }

    /* ==================== RESULTS SCREEN ==================== */
    .results-card {
      background-color: rgb(var(--color-surface));
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow:
        0 1px 3px rgba(var(--color-shadow), 0.08),
        0 4px 16px rgba(var(--color-shadow), 0.06);
      animation: fadeSlideDown 0.4s ease both;
    }

    .results-score-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      /* background and box-shadow set via JS to match the active quiz group */
    }

    .results-score-number {
      font-size: 32px;
      font-weight: 600;
      color: rgb(var(--color-on-primary));
      line-height: 1;
    }

    .results-score-total {
      font-size: 14px;
      color: rgb(var(--color-on-primary));
      font-weight: 400;
    }

    .results-title {
      font-size: 20px;
      font-weight: 600;
      color: rgb(var(--color-on-surface));
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .results-message {
      font-size: 14px;
      font-weight: 400;
      color: rgb(var(--color-on-surface-variant));
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .results-stat-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .results-stat {
      flex: 1;
      padding: 14px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .results-stat.stat-correct { background-color: rgb(var(--color-success-container)); }
    .results-stat.stat-wrong   { background-color: rgb(var(--color-error-container)); }

    .results-stat-value {
      font-size: 24px;
      font-weight: 600;
      line-height: 1.1;
    }

    .stat-correct .results-stat-value { color: rgb(var(--color-success)); }
    .stat-wrong   .results-stat-value { color: rgb(var(--color-error)); }

    .results-stat-label {
      font-size: 12px;
      font-weight: 400;
      margin-top: 2px;
    }

    .stat-correct .results-stat-label { color: rgb(var(--color-on-success-container)); }
    .stat-wrong   .results-stat-label { color: rgb(var(--color-on-error-container)); }

    .results-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }

    .restart-btn {
      width: 100%;
      padding: 14px 20px;
      color: rgb(var(--color-on-primary));
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .restart-btn:hover  { opacity: 0.92; }
    .restart-btn:active { transform: scale(0.99); }

    .back-to-categories-btn {
      width: 100%;
      padding: 13px 20px;
      background-color: transparent;
      color: rgb(var(--color-on-surface-variant));
      border: 1.5px solid rgb(var(--color-outline-variant));
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .back-to-categories-btn:hover {
      background-color: rgb(var(--color-surface-container));
      border-color: rgb(var(--color-outline));
    }

    /* ==================== ANIMATIONS ==================== */
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question-transition-out { animation: slideOut 0.25s ease forwards; }
    .question-transition-in  { animation: slideIn  0.3s  ease forwards; }

    @keyframes slideOut {
      to { opacity: 0; transform: translateX(-20px); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ==================== HIDDEN UTILITY ==================== */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="quiz-wrapper" id="app">

  <!-- CATEGORY SELECTION SCREEN -->
  <div id="category-screen">
    <div class="category-header">
      <div class="category-title">Quiz Hub</div>
      <div class="category-subtitle">Choose a topic to get started</div>
    </div>
    <div class="category-grid" id="category-grid">
      <!-- Cards rendered by JS so quiz group data is the single source of truth -->
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="quiz-header">
      <div class="quiz-header-inner">
        <button class="back-btn" id="quiz-back-btn" aria-label="Back to categories">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="quiz-title" id="quiz-title">Quiz</div>
      </div>
      <div class="quiz-subtitle" id="quiz-subtitle"></div>
    </div>

    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%"></div>
    </div>

    <div class="question-card" id="question-card">
      <div class="question-meta">
        <span class="question-badge" id="q-badge">Question 1</span>
        <span class="question-counter" id="q-counter">1 / 1</span>
      </div>
      <p class="question-text" id="q-text"></p>
      <ul class="choices-list" id="choices-list"></ul>
      <div class="feedback-bar" id="feedback-bar"></div>
      <button class="next-btn" id="next-btn"></button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="hidden">
    <div class="results-card">
      <div class="results-score-ring" id="results-score-ring">
        <div>
          <div class="results-score-number" id="res-score">0</div>
          <div class="results-score-total" id="res-total">/ 0</div>
        </div>
      </div>
      <div class="results-title" id="res-title">Well done!</div>
      <div class="results-message" id="res-message"></div>
      <div class="results-stat-row">
        <div class="results-stat stat-correct">
          <div class="results-stat-value" id="res-correct">0</div>
          <div class="results-stat-label">Correct</div>
        </div>
        <div class="results-stat stat-wrong">
          <div class="results-stat-value" id="res-wrong">0</div>
          <div class="results-stat-label">Incorrect</div>
        </div>
      </div>
      <div class="results-btn-group">
        <button class="restart-btn" id="restart-btn">Try Again</button>
        <button class="back-to-categories-btn" id="back-to-cat-btn">← All Categories</button>
      </div>
    </div>
  </div>

</div>

<script>
  /* ==================== QUIZ DATA ==================== */
  // Each group is self-contained so new topics can be appended without touching any other code.
  // gradient / accentRgb drive the progress bar, next button, and score ring for that group,
  // keeping the visual language cohesive per topic without a per-group stylesheet.
  const quizGroups = [
    {
      id: 'python',
      title: 'Python',
      icon: '🐍',
      gradient: 'linear-gradient(135deg, rgb(49,150,82) 0%, rgb(24,133,154) 100%)',
      accentRgb: '49 150 82',
      difficulty: 'beginner',
      questions: [
        {
          num: 1,
          question: "What is the correct file extension for Python files?",
          choices: [
            { label: "A", text: ".py", isCorrect: true },
            { label: "B", text: ".pt", isCorrect: false },
            { label: "C", text: ".pyt", isCorrect: false },
            { label: "D", text: ".python", isCorrect: false }

        {
          num: 2,
          question: "Which keyword is used to define a function in Python?",
          choices: [
            { label: "A", text: "function", isCorrect: false },
            { label: "B", text: "func", isCorrect: false },
            { label: "C", text: "def", isCorrect: true },
            { label: "D", text: "define", isCorrect: false }

        {
          num: 3,
          question: "What data type is the result of: type([])?",

            { label: "A", text: "tuple", isCorrect: false },
            { label: "B", text: "array", isCorrect: false },
            { label: "C", text: "list", isCorrect: true },
            { label: "D", text: "dict", isCorrect: false }
          ]
        },
        {
          num: 4,
          question: "Which of the following is used to handle exceptions in Python?",

            { label: "A", text: "try / catch", isCorrect: false },
            { label: "B", text: "try / except", isCorrect: true },
            { label: "C", text: "begin / rescue", isCorrect: false },
            { label: "D", text: "check / handle", isCorrect: false }
          ]
        },
        {
          num: 5,
          question: "What does the `len()` function return?",
          choices: [
            { label: "A", text: "The last element of a sequence", isCorrect: false },
            { label: "B", text: "The memory size of an object", isCorrect: false },
            { label: "C", text: "The number of items in an object", isCorrect: true },
            { label: "D", text: "The type of an object", isCorrect: false }

        },
        {
          num: 6,
          question: "Which symbol is used for single-line comments in Python?",
          choices: [
            { label: "A", text: "//", isCorrect: false },
            { label: "B", text: "--", isCorrect: false },
            { label: "C", text: "#", isCorrect: true },

    },
    {
      id: 'javascript',
      title: 'JavaScript',
      icon: '⚡',
      gradient: 'linear-gradient(135deg, rgb(225,175,0) 0%, rgb(210,110,0) 100%)',
      accentRgb: '200 140 0',
      difficulty: 'intermediate',
      questions: [
        {
          num: 1,

            { label: "D", text: "Flask", isCorrect: false }
          ]
        },
        {
          num: 4,

          choices: [
            { label: "A", text: "Value only", isCorrect: false },
            { label: "B", text: "Type only", isCorrect: false },
            { label: "C", text: "Value and type (strict equality)", isCorrect: true },
            { label: "D", text: "Reference equality", isCorrect: false }
          ]
        },
        {
          num: 5,
          question: "Which keyword declares a block-scoped variable in modern JavaScript?",
          choices: [
            { label: "A", text: "var", isCorrect: false },
            { label: "B", text: "let", isCorrect: true },
            { label: "C", text: "set", isCorrect: false },
            { label: "D", text: "define", isCorrect: false }
          ]
        },
        {
          num: 6,
          question: "What does `console.log()` do?",
          choices: [
            { label: "A", text: "Writes to a file", isCorrect: false },
            { label: "B", text: "Sends data to the server", isCorrect: false },
            { label: "C", text: "Prints output to the browser console", isCorrect: true },
            { label: "D", text: "Displays a browser alert", isCorrect: false }
          ]
        }
      ]
    },
    {
      id: 'html-css',
      title: 'HTML & CSS',
      icon: '🎨',
      gradient: 'linear-gradient(135deg, rgb(53,109,232) 0%, rgb(23,129,175) 100%)',
      accentRgb: '53 109 232',
      difficulty: 'beginner',
      questions: [
        {
          num: 1,
          question: "Which CSS property controls the text size?",
          choices: [
            { label: "A", text: "text-size", isCorrect: false },
            { label: "B", text: "font-size", isCorrect: true },
            { label: "C", text: "text-style", isCorrect: false },
            { label: "D", text: "font-style", isCorrect: false }
          ]
        },
        {
          num: 2,
          question: "What does CSS stand for?",
          choices: [
            { label: "A", text: "Computer Style Sheets", isCorrect: false },
            { label: "B", text: "Cascading Style Sheets", isCorrect: true },
            { label: "C", text: "Creative Style System", isCorrect: false },
            { label: "D", text: "Colorful Styling Script", isCorrect: false }
          ]
        },
        {
          num: 3,
          question: "Which HTML tag is used to link an external stylesheet?",
          choices: [
            { label: "A", text: "<style>", isCorrect: false },
            { label: "B", text: "<script>", isCorrect: false },
            { label: "C", text: "<link>", isCorrect: true },
            { label: "D", text: "<css>", isCorrect: false }
          ]
        },
        {
          num: 4,
          question: "Which CSS property is used to add space inside an element's border?",
          choices: [
            { label: "A", text: "margin", isCorrect: false },
            { label: "B", text: "spacing", isCorrect: false },
            { label: "C", text: "padding", isCorrect: true },
            { label: "D", text: "border-spacing", isCorrect: false }
          ]
        },
        {
          num: 5,
          question: "Which HTML attribute specifies the URL of a hyperlink?",
          choices: [
            { label: "A", text: "src", isCorrect: false },
            { label: "B", text: "href", isCorrect: true },
            { label: "C", text: "url", isCorrect: false },
            { label: "D", text: "link", isCorrect: false }
          ]
        },
        {
          num: 6,
          question: "What value of `display` makes an element a flex container?",
          choices: [
            { label: "A", text: "block", isCorrect: false },
            { label: "B", text: "inline", isCorrect: false },
            { label: "C", text: "flex", isCorrect: true },
            { label: "D", text: "grid-flex", isCorrect: false }
          ]
        }
      ]
    },
    {
      id: 'computer-history',
      title: 'Computer History',
      icon: '🖥️',
      gradient: 'linear-gradient(135deg, rgb(128,87,221) 0%, rgb(55,109,232) 100%)',
      accentRgb: '128 87 221',
      difficulty: 'intermediate',
      questions: [
        {
          num: 1,
          question: "Who is widely credited as the inventor of the World Wide Web?",
          choices: [
            { label: "A", text: "Bill Gates", isCorrect: false },
            { label: "B", text: "Tim Berners-Lee", isCorrect: true },
            { label: "C", text: "Vint Cerf", isCorrect: false },
            { label: "D", text: "Alan Turing", isCorrect: false }
          ]
        },
        {
          num: 2,
          question: "What was the name of the first commercially successful personal computer?",
          choices: [
            { label: "A", text: "Apple I", isCorrect: false },
            { label: "B", text: "Altair 8800", isCorrect: false },
            { label: "C", text: "IBM PC", isCorrect: false },
            { label: "D", text: "Apple II", isCorrect: true }
          ]
        },
        {
          num: 3,
          question: "ENIAC, one of the first general-purpose computers, was built in which decade?",
          choices: [
            { label: "A", text: "1930s", isCorrect: false },
            { label: "B", text: "1940s", isCorrect: true },
            { label: "C", text: "1950s", isCorrect: false },
            { label: "D", text: "1960s", isCorrect: false }
          ]
        },
        {
          num: 4,
          question: "Alan Turing is best known for his foundational work in which area?",
          choices: [
            { label: "A", text: "Database design", isCorrect: false },
            { label: "B", text: "Computer networking", isCorrect: false },
            { label: "C", text: "Theoretical computation and AI", isCorrect: true },
            { label: "D", text: "Integrated circuit design", isCorrect: false }
          ]
        },
        {
          num: 5,
          question: "The first computer mouse was invented by whom?",
          choices: [
            { label: "A", text: "Steve Jobs", isCorrect: false },
            { label: "B", text: "Douglas Engelbart", isCorrect: true },
            { label: "C", text: "Gordon Moore", isCorrect: false },
            { label: "D", text: "Dennis Ritchie", isCorrect: false }
          ]
        },
        {
          num: 6,
          question: "What does 'Moore's Law' predict?",
          choices: [
            { label: "A", text: "Internet bandwidth doubles every 18 months", isCorrect: false },
            { label: "B", text: "Storage cost halves every 2 years", isCorrect: false },
            { label: "C", text: "Transistor count on chips roughly doubles every two years", isCorrect: true },
            { label: "D", text: "CPU clock speed doubles every year", isCorrect: false }
          ]
        }
      ]
    }
  ];

  /* ==================== STATE ==================== */
  let activeGroup   = null;  // reference to the selected quizGroups entry
  let currentIndex  = 0;
  let score         = 0;
  let answered      = false;

  /* ==================== DOM REFS ==================== */
  const categoryScreen  = document.getElementById('category-screen');
  const quizScreen      = document.getElementById('quiz-screen');
  const resultsScreen   = document.getElementById('results-screen');
  const categoryGrid    = document.getElementById('category-grid');
  const quizTitle       = document.getElementById('quiz-title');
  const quizSubtitle    = document.getElementById('quiz-subtitle');
  const qBadge          = document.getElementById('q-badge');
  const qCounter        = document.getElementById('q-counter');
  const qText           = document.getElementById('q-text');
  const choicesList     = document.getElementById('choices-list');
  const feedbackBar     = document.getElementById('feedback-bar');
  const nextBtn         = document.getElementById('next-btn');
  const progressFill    = document.getElementById('progress-fill');
  const card            = document.getElementById('question-card');
  const scoreRing       = document.getElementById('results-score-ring');
  const restartBtn      = document.getElementById('restart-btn');
  const backToCatBtn    = document.getElementById('back-to-cat-btn');
  const quizBackBtn     = document.getElementById('quiz-back-btn');

  /* ==================== UTILS ==================== */
  // Prevents question data containing angle-bracket tags (e.g. "<link>") from
  // being parsed as live HTML when injected via innerHTML in renderQuestion().
  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ==================== CATEGORY SCREEN ==================== */
  function renderCategories() {
    categoryGrid.innerHTML = '';

    quizGroups.forEach((group, idx) => {
      const btn = document.createElement('button');
      btn.className = 'category-card';
      btn.setAttribute('aria-label', `Start ${group.title} quiz, ${group.questions.length} questions`);

      const diffLabel   = group.difficulty === 'beginner' ? 'Beginner' : 'Intermediate';
      const diffClass   = group.difficulty === 'beginner' ? 'difficulty-beginner' : 'difficulty-intermediate';

      btn.innerHTML = `
        <div class="category-icon-wrap" style="background:${escapeHTML(group.gradient)};">
          <span role="img" aria-hidden="true">${escapeHTML(group.icon)}</span>
        </div>
        <div class="category-card-title">${escapeHTML(group.title)}</div>
        <div class="category-card-meta">
          <span class="category-count">${group.questions.length} questions</span>
          <span class="category-difficulty ${diffClass}">${diffLabel}</span>
        </div>
      `;

      btn.addEventListener('click', () => startQuiz(idx));
      categoryGrid.appendChild(btn);
    });
  }

  function showCategoryScreen() {
    resultsScreen.classList.add('hidden');
    quizScreen.classList.add('hidden');
    categoryScreen.classList.remove('hidden');
    // Re-render so stagger animations replay when returning from results
    renderCategories();
  }

  /* ==================== QUIZ START ==================== */
  function startQuiz(groupIndex) {
    activeGroup  = quizGroups[groupIndex];
    currentIndex = 0;
    score        = 0;
    answered     = false;

    // Apply the group's gradient to shared elements so each quiz feels visually distinct
    progressFill.style.background = activeGroup.gradient;
    nextBtn.style.background      = activeGroup.gradient;
    scoreRing.style.background    = activeGroup.gradient;
    scoreRing.style.boxShadow     = `0 4px 20px rgba(${activeGroup.accentRgb}, 0.35)`;
    restartBtn.style.background   = activeGroup.gradient;

    quizTitle.textContent    = activeGroup.title;
    quizSubtitle.textContent = `${activeGroup.questions.length} questions · ${activeGroup.difficulty === 'beginner' ? 'Beginner' : 'Intermediate'}`;

    categoryScreen.classList.add('hidden');
    resultsScreen.classList.add('hidden');
    quizScreen.classList.remove('hidden');

    renderQuestion();
  }

  /* ==================== RENDER QUESTION ==================== */
  function renderQuestion() {
    answered = false;
    // slideOut uses fill-mode:forwards, so the card stays invisible after the last-question
    // transition unless we explicitly clear both classes before re-rendering.
    card.classList.remove('question-transition-out', 'question-transition-in');

    const q      = activeGroup.questions[currentIndex];
    const total  = activeGroup.questions.length;
    const progress = (currentIndex / total) * 100;

    qBadge.textContent          = `Question ${q.num}`;
    qCounter.textContent        = `${currentIndex + 1} / ${total}`;
    qText.textContent           = q.question;
    progressFill.style.width    = `${progress}%`;

    nextBtn.textContent = currentIndex < total - 1 ? 'Next Question →' : 'See Results';
    nextBtn.classList.remove('visible');

    feedbackBar.className   = 'feedback-bar';
    feedbackBar.textContent = '';

    choicesList.innerHTML = '';
    q.choices.forEach(choice => {
      const li  = document.createElement('li');
      const btn = document.createElement('button');
      btn.className        = 'choice-btn';
      btn.dataset.correct  = choice.isCorrect;

      btn.innerHTML = `
        <span class="choice-label">${escapeHTML(choice.label)}</span>
        <span class="choice-text">${escapeHTML(choice.text)}</span>
        <svg class="choice-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          ${choice.isCorrect
            ? `<path d="M4 10l4.5 4.5L16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
            : `<path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`
          }
        </svg>
      `;

      btn.setAttribute('aria-label', `Choice ${choice.label}: ${choice.text}`);
      btn.addEventListener('click', () => handleAnswer(btn, choice.isCorrect));
      li.appendChild(btn);
      choicesList.appendChild(li);
    });
  }

  /* ==================== ANSWER HANDLER ==================== */
  function handleAnswer(selectedBtn, isCorrect) {
    if (answered) return;
    answered = true;

    const allBtns = choicesList.querySelectorAll('.choice-btn');
    allBtns.forEach(btn => btn.disabled = true);

    if (isCorrect) {
      score++;
      selectedBtn.classList.add('correct');
      allBtns.forEach(btn => { if (btn !== selectedBtn) btn.classList.add('muted'); });
      showFeedback(true, 'Correct! Great job.');
    } else {
      selectedBtn.classList.add('wrong');
      allBtns.forEach(btn => {
        if (btn.dataset.correct === 'true') btn.classList.add('reveal-correct');
        else if (btn !== selectedBtn) btn.classList.add('muted');
      });
      showFeedback(false, 'Not quite — the correct answer is highlighted.');
    }

    const total = activeGroup.questions.length;
    progressFill.style.width = `${((currentIndex + 1) / total) * 100}%`;
    nextBtn.classList.add('visible');
  }

  /* ==================== FEEDBACK ==================== */
  function showFeedback(isCorrect, message) {
    feedbackBar.textContent = (isCorrect ? '✓ ' : '✗ ') + message;
    feedbackBar.className   = `feedback-bar visible ${isCorrect ? 'correct-feedback' : 'wrong-feedback'}`;
  }

  /* ==================== NAVIGATION ==================== */
  nextBtn.addEventListener('click', () => {
    if (!answered) return;

    card.classList.add('question-transition-out');

    setTimeout(() => {
      currentIndex++;

      if (currentIndex >= activeGroup.questions.length) {
        showResults();
      } else {
        renderQuestion();
        card.classList.remove('question-transition-out');
        card.classList.add('question-transition-in');
        // Remove animation class so it can replay on the next transition
        setTimeout(() => card.classList.remove('question-transition-in'), 300);
      }
    }, 220);
  });

  // Back button in the quiz header returns to category selection mid-quiz
  quizBackBtn.addEventListener('click', showCategoryScreen);

  // Restart runs the same quiz group again without reloading the page
  restartBtn.addEventListener('click', () => {
    const groupIndex = quizGroups.indexOf(activeGroup);
    startQuiz(groupIndex);
  });

  backToCatBtn.addEventListener('click', showCategoryScreen);

  /* ==================== RESULTS ==================== */
  function showResults() {
    quizScreen.classList.add('hidden');
    resultsScreen.classList.remove('hidden');

    const total   = activeGroup.questions.length;
    const wrong   = total - score;
    const percent = Math.round((score / total) * 100);

    document.getElementById('res-score').textContent   = score;
    document.getElementById('res-total').textContent   = `/ ${total}`;
    document.getElementById('res-correct').textContent = score;
    document.getElementById('res-wrong').textContent   = wrong;

    let title, message;
    if (percent === 100) {
      title   = 'Perfect Score! 🎉';
      message = 'You got every question right. Incredible!';
    } else if (percent >= 70) {
      title   = 'Well Done!';
      message = `You scored ${percent}%. Solid performance — keep it up!`;
    } else if (percent >= 40) {
      title   = 'Good Effort!';
      message = `You scored ${percent}%. A little more practice and you'll ace it.`;
    } else {
      title   = 'Keep Practicing!';
      message = `You scored ${percent}%. Don't give up — try again!`;
    }

    document.getElementById('res-title').textContent   = title;
    document.getElementById('res-message').textContent = message;
  }

  /* ==================== BOOT ==================== */
  // Start on the category selection screen rather than jumping into a quiz,
  // since the app now has multiple entry points.
  showCategoryScreen();
</script>
</body>
</html>
